name: Pull Request Labeler

# Reusable workflow: labels PRs by branch name using the org-wide rules in
# .github/labeler.yml of this repo.
#
# Caller (no secrets needed, do not use "secrets: inherit"):
#   on:
#     pull_request:
#       types: [opened, reopened, synchronize]
#   jobs:
#     labeler:
#       uses: opportify/.github/.github/workflows/labeler.yml@main
#       permissions:
#         contents: read
#         pull-requests: write

on:
  workflow_call:

permissions:
  contents: read

jobs:
  apply-labels:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout opportify/.github (label rules)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: opportify/.github
          ref: main
          path: dotgithub
          persist-credentials: false

      - name: Apply labels
        uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9 # v5.0.0
        with:
          sync-labels: true
          repo-token: ${{ github.token }}
          configuration-path: dotgithub/.github/labeler.yml
